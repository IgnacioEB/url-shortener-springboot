services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener_user
      POSTGRES_PASSWORD: urlshortener_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Este script se ejecuta automáticamente la primera vez
      # que se crea la base, creando la tabla que necesita la app
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urlshortener_user
      SPRING_DATASOURCE_PASSWORD: urlshortener_pass
    depends_on:
      - db

volumes:
  postgres_data:
