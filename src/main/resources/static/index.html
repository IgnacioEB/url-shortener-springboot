<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acortador de URLs</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 0 20px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
    }
    #resultado {
      margin-top: 20px;
      word-break: break-all;
    }
    #resultado a {
      font-weight: bold;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Acortador de URLs</h1>
  <form id="form">
    <input type="url" id="urlInput" placeholder="https://ejemplo.com/pagina-larga" required>
    <button type="submit">Acortar</button>
  </form>
  <div id="resultado"></div>

  <script>
    const form = document.getElementById('form');
    const resultadoDiv = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('urlInput').value;
      resultadoDiv.textContent = 'Acortando...';

      try {
        const res = await fetch('/acortar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!res.ok) {
          resultadoDiv.innerHTML = `<span class="error">${data.message}</span>`;
          return;
        }

        const shortLink = `${window.location.origin}/${data.shortUrl}`;
        resultadoDiv.innerHTML = `Tu link corto: <a href="${shortLink}" target="_blank">${shortLink}</a>`;
      } catch (err) {
        resultadoDiv.innerHTML = `<span class="error">Error de conexión</span>`;
      }
    });
  </script>
</body>
</html>
